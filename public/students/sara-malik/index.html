<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator — Lahore Toolbox</title>
  <link rel="stylesheet" href="../../styles/shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="../../index.html" class="back-link">&larr; Back to all tools</a>

    <div class="card">
      <div class="tool-header">
        <h1>BMI & Healthy Weight Calculator</h1>
        <p class="muted">Check Body Mass Index and healthy weight ranges for your height.</p>
      </div>

      <div class="form-group">
        <label for="height-cm">Height (Centimeters)</label>
        <input type="number" id="height-cm" class="input" placeholder="e.g. 175" value="172" min="100" max="250">
      </div>

      <div class="form-group">
        <label for="weight-kg">Weight (Kilograms)</label>
        <input type="number" id="weight-kg" class="input" placeholder="e.g. 68" value="66" min="20" max="300" step="0.5">
      </div>

      <button id="calculate-btn" class="btn">Calculate BMI</button>

      <div id="result" class="result" hidden></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
