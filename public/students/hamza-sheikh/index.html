<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Budget Tracker — Lahore Toolbox</title>
  <link rel="stylesheet" href="../../styles/shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="../../index.html" class="back-link">&larr; Back to all tools</a>

    <div class="card">
      <div class="tool-header">
        <h1>Grocery Budget Tracker</h1>
        <p class="muted">Track bazaar grocery shopping expenses live against your monthly household budget limit.</p>
      </div>

      <div class="form-group">
        <label for="monthly-budget">Shopping Budget Target (PKR)</label>
        <input type="number" id="monthly-budget" class="input" value="12000" min="500" step="500">
      </div>

      <div class="add-item-box">
        <div class="form-group" style="margin-bottom: 10px;">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" class="input" placeholder="e.g. Basmati Rice 5kg">
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label for="item-qty">Quantity</label>
            <input type="number" id="item-qty" class="input" value="1" min="1" step="1">
          </div>
          <div class="form-group">
            <label for="item-price">Price per item (PKR)</label>
            <input type="number" id="item-price" class="input" placeholder="e.g. 1450" min="1">
          </div>
        </div>

        <button id="add-item-btn" class="btn" style="width: 100%;">+ Add to Grocery List</button>
      </div>

      <div class="budget-status-card" id="budget-status">
        <div class="status-row">
          <span>Spent Total: <strong id="spent-display">PKR 0</strong></span>
          <span>Remaining: <strong id="remaining-display">PKR 12,000</strong></span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar" style="width: 0%;"></div>
        </div>
      </div>

      <h3 style="font-size: 16px; margin: 20px 0 10px;">Shopping Basket Items</h3>
      <div id="items-list" class="items-list-container">
        <!-- populated dynamically -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
