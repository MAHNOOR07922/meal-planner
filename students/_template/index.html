<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Name — Lahore Toolbox</title>
  <link rel="stylesheet" href="../../styles/shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="../../index.html" class="back-link">&larr; Back to all tools</a>

    <div class="card">
      <h1>Tool Title</h1>
      <p class="muted" style="margin-top: 4px; margin-bottom: 24px;">
        Brief one-line description of what this tool does.
      </p>

      <div class="form-group">
        <label for="example-input">First Value</label>
        <input type="number" id="example-input" class="input" placeholder="e.g. 100">
      </div>

      <div class="form-group">
        <label for="second-input">Second Value</label>
        <input type="number" id="second-input" class="input" placeholder="e.g. 5">
      </div>

      <button id="calculate-btn" class="btn">Calculate</button>

      <div id="result" class="result" hidden></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
